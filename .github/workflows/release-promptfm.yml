name: 🚀 Release PromptFM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version (defaults to package.json version if blank, e.g. 0.1.0)'
        required: false
        default: ''
      target_commit:
        description: 'Target Git SHA or branch to cut release from (defaults to HEAD)'
        required: false
        default: ''
  push:
    tags:
      - 'promptfm/*'

permissions:
  contents: write
  deployments: write
  statuses: write
  pull-requests: write

concurrency:
  group: release-promptfm
  cancel-in-progress: false

jobs:
  release-promptfm:
    name: release-promptfm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Quality Gate (Tests & Types)
        run: |
          npm test
          npm run typecheck

      - name: Compute Release Tag & Cut Metadata
        id: meta
        run: |
          node -e '
            const fs = require("fs");
            const { formatReleaseTag } = require("./src/lib/infra/release-tag");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            const inputVersion = ("${{ github.event.inputs.version }}" || "").trim();
            const version = inputVersion || pkg.version || "0.1.0";
            
            const targetCommit = ("${{ github.event.inputs.target_commit }}" || "").trim();
            const sha = targetCommit || process.env.GITHUB_SHA || "HEAD";
            
            const currentTag = "${{ github.ref_name }}";
            let releaseTag = "";
            if (currentTag && currentTag.startsWith("promptfm/")) {
              releaseTag = currentTag;
            } else {
              const fullSha = require("child_process").execSync(`git rev-parse ${sha}`, { encoding: "utf8" }).trim();
              releaseTag = formatReleaseTag(version, fullSha);
            }
            
            console.log(`Resolved Release Tag: ${releaseTag}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${releaseTag}\n`);
          '
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Create and Push Release Tag (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          echo "Tagging HEAD with: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Deploy to Vercel (Production)
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying to Vercel Production via Vercel CLI..."
            PROD_URL=$(npx vercel --prod --yes --token="$VERCEL_TOKEN")
            echo "Vercel Production URL: $PROD_URL"
            echo "prod_url=$PROD_URL" >> $GITHUB_OUTPUT
          elif [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Vercel Production Deploy Hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
            echo "Deploy hook status: $HTTP_STATUS"
            echo "prod_url=https://promptfm.live" >> $GITHUB_OUTPUT
          else
            echo "Vercel auto-deploys via GitHub Git Integration on release tags."
            echo "prod_url=https://promptfm.live" >> $GITHUB_OUTPUT
          fi

      - name: Verify Live Production Station Endpoint
        run: |
          echo "Probing production station health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://promptfm.live/api/status" || echo "000")
          echo "Production health status: $STATUS"

      - name: Create GitHub Release & Changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "PromptFM ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

