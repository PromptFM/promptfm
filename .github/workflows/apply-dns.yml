name: 🌐 Apply Hostinger DNS Changes

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to apply DNS changes to'
        default: 'promptfm.live'
        required: true
      force:
        description: 'Force overwrite existing zone'
        default: 'true'
        required: false
  push:
    tags:
      - 'promptfm-dns/*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: dns-apply
  cancel-in-progress: false

jobs:
  apply-dns:
    name: apply-dns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure GCP Service Account Credentials (Secret Manager $0 Tier)
        run: |
          mkdir -p ~/.config/gcloud
          if [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            if echo "${{ secrets.GCP_SA_KEY }}" | grep -q '^{'; then
              echo "${{ secrets.GCP_SA_KEY }}" > /tmp/gcp-sa-key.json
            else
              echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > /tmp/gcp-sa-key.json
            fi
            gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
            gcloud config set project promptfm-radio-1793623670
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json" >> $GITHUB_ENV
            echo "✓ GCP credentials configured successfully for Hostinger DNS token resolution."
          fi

      - name: Validate DNS State Before Applying ($0 Egress Enforcement)
        run: npm run promptfm -- dns validate ${{ inputs.domain || 'promptfm.live' }} --state infra/dns/promptfm.live.state.json

      - name: Apply Hostinger DNS Zone State
        run: npm run promptfm -- dns apply ${{ inputs.domain || 'promptfm.live' }} --state infra/dns/promptfm.live.state.json --force

