name: 🌐 Apply Hostinger DNS Changes

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to apply DNS changes to'
        default: 'promptfm.live'
        required: true
      force:
        description: 'Force overwrite existing zone'
        default: 'true'
        required: false
  push:
    tags:
      - 'promptfm-dns/*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: dns-apply
  cancel-in-progress: false

jobs:
  apply-dns:
    name: apply-dns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pull Secrets from Vercel (Single Source of Truth)
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel env pull .env.infra.local --environment=production --yes
          else
            echo "ℹ️ VERCEL_TOKEN not provided, skipping Vercel env pull."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Validate DNS State Before Applying ($0 Egress Enforcement)
        run: npm run promptfm -- dns validate ${{ inputs.domain || 'promptfm.live' }} --state infra/dns/promptfm.live.state.json
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

      - name: Apply Hostinger DNS Zone State
        run: npm run promptfm -- dns apply ${{ inputs.domain || 'promptfm.live' }} --state infra/dns/promptfm.live.state.json --force
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

