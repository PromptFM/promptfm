name: 🚀 Automatic Release & Vercel Production Gate

on:
  push:
    tags:
      - 'promptfm/*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version (defaults to package.json version if blank, e.g. 0.2.0 or promptfm/v0.2.0)'
        required: false
        default: ''
      target_commit:
        description: 'Target Git SHA or branch to cut release from (defaults to HEAD)'
        required: false
        default: ''

permissions:
  contents: write
  deployments: write
  statuses: write
  pull-requests: write

concurrency:
  group: release-promptfm
  cancel-in-progress: false

jobs:
  release:
    name: 📦 Package, Release & Stamp Vercel Deployment
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Verify Quality & Unit Test Suite
        run: |
          npm test
          npm run typecheck

      - name: 🏷️ Resolve Release Tag & Metadata
        id: meta
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            const currentTag = "${{ github.ref_name }}";
            const inputVersion = ("${{ github.event.inputs.version }}" || "").trim();
            const targetCommit = ("${{ github.event.inputs.target_commit }}" || "").trim();
            const sha = targetCommit || process.env.GITHUB_SHA || "HEAD";
            
            let releaseTag = "";
            if (currentTag && (currentTag.startsWith("promptfm/") || currentTag.startsWith("v"))) {
              releaseTag = currentTag;
            } else if (inputVersion) {
              releaseTag = inputVersion.startsWith("promptfm/") || inputVersion.startsWith("v")
                ? inputVersion
                : "promptfm/v" + inputVersion;
            } else {
              const version = pkg.version || "0.2.0";
              releaseTag = "promptfm/v" + version;
            }
            
            console.log(`Resolved Release Tag: ${releaseTag}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${releaseTag}\n`);
          '
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: 🏷️ Push Release Tag (if manual trigger and not already tagged)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists on remote, proceeding."
          else
            echo "Tagging HEAD with: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: 🌐 Create GitHub Deployment (Production)
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: 'production'
          description: 'PromptFM Live 24/7 Radio Station Production Deployment'
          ref: ${{ steps.meta.outputs.tag }}

      - name: 🚀 Verify / Trigger Vercel Production Build
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying to Vercel Production via Vercel CLI..."
            PROD_URL=$(npx vercel --prod --yes --token="$VERCEL_TOKEN")
            echo "Vercel Production URL: $PROD_URL"
            echo "target_url=$PROD_URL" >> $GITHUB_OUTPUT
          elif [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Vercel Production Deploy Hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK")
            echo "Vercel deploy hook HTTP status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Deploy hook triggered successfully."
            else
              echo "Deploy hook returned non-2xx status ($HTTP_STATUS), proceeding with git integration verification."
            fi
            echo "target_url=https://promptfm.live" >> $GITHUB_OUTPUT
          else
            echo "Vercel auto-deploys via GitHub Git Integration on release tags/main under $0 budget policy."
            echo "target_url=https://promptfm.live" >> $GITHUB_OUTPUT
          fi

      - name: 🩺 Verify Production Station Endpoint
        id: health_check
        run: |
          echo "Probing production station endpoint..."
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://promptfm.live/api/status" || echo "000")
          echo "Production health check status: $HEALTH_STATUS"

      - name: ✅ Stamp Deployment Checkmark as Active
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'success'
          environment-url: 'https://promptfm.live'
          description: 'Verified on Vercel Production ($0 Infra Path)'

      - name: ❌ Stamp Deployment Failure (if build failed)
        if: failure() && steps.deployment.outputs.deployment_id != ''
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'failure'

      - name: 📝 Publish GitHub Release & Changelog
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "PromptFM ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
