name: 🚀 Release PromptFM via OCI Web Deploy

on:
  push:
    tags:
      - 'promptfm/*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to tag and deploy (defaults to package.json version if blank)'
        required: false
        default: ''
      target_commit:
        description: 'Target Git SHA or ref to release (defaults to HEAD on the checked out ref)'
        required: false
        default: ''

permissions:
  contents: write
  deployments: write
  id-token: write
  packages: write
  statuses: write
  pull-requests: write

concurrency:
  group: release-promptfm
  cancel-in-progress: false

jobs:
  prepare-release:
    name: 📦 Prepare OCI release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_ref: ${{ steps.meta.outputs.release_ref }}
      release_id: ${{ steps.meta.outputs.release_id }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Verify Quality & Unit Test Suite
        run: |
          npm test
          npm run typecheck

      - name: 🏷️ Resolve release tag, ref, and OCI metadata
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_TARGET_COMMIT: ${{ github.event.inputs.target_commit || '' }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: node scripts/release-workflow-metadata.cjs

      - name: 🏷️ Push release tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists on remote, proceeding."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: 🌐 Create GitHub Deployment (Production)
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: 'PromptFM OCI production deployment with candidate cutover'
          ref: ${{ steps.meta.outputs.release_tag }}

  # deploy-web-oci.yml owns docker buildx build --platform linux/amd64,linux/arm64,
  # candidate /api/healthz gating, cutover, and retained-release metadata for rollback.
  deploy-web-oci:
    name: deploy-web-oci
    needs: prepare-release
    uses: ./.github/workflows/deploy-web-oci.yml
    with:
      ref: ${{ needs.prepare-release.outputs.release_ref }}
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
      release_id: ${{ needs.prepare-release.outputs.release_id }}
      deploy_reason: release-cutover
      image_platforms: linux/amd64,linux/arm64
      health_check_path: /api/healthz
      status_check_path: /api/status
      retained_release_count: '1'
    secrets: inherit

  publish-release:
    name: 📝 Publish release evidence
    needs:
      - prepare-release
      - deploy-web-oci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - name: ✅ Stamp Deployment Success
        if: needs.deploy-web-oci.result == 'success' && needs.prepare-release.outputs.deployment_id != ''
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.prepare-release.outputs.deployment_id }}
          state: success
          environment-url: https://promptfm.live
          description: 'OCI cutover finished after candidate /api/healthz gate'

      - name: ❌ Stamp Deployment Failure
        if: needs.deploy-web-oci.result != 'success' && needs.prepare-release.outputs.deployment_id != ''
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ needs.prepare-release.outputs.deployment_id }}
          state: failure
          environment-url: https://promptfm.live
          description: 'OCI deploy or cutover failed before completion'

      - name: 🧾 Write release summary
        run: |
          echo "### 🚀 OCI web release" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release tag:** \`${{ needs.prepare-release.outputs.release_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release ref:** \`${{ needs.prepare-release.outputs.release_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ needs.deploy-web-oci.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image digest:** \`${{ needs.deploy-web-oci.outputs.image_digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Free-tier gate:** \`${{ needs.deploy-web-oci.outputs.free_tier_gate }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Candidate health gate:** \`${{ needs.deploy-web-oci.outputs.healthz_url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cutover result:** \`${{ needs.deploy-web-oci.outputs.deploy_result }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Retained previous release:** \`${{ needs.deploy-web-oci.outputs.previous_release }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Retained release metadata artifact:** \`${{ needs.deploy-web-oci.outputs.retained_release_metadata }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Publish GitHub Release & Changelog
        if: needs.deploy-web-oci.result == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: PromptFM ${{ needs.prepare-release.outputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
