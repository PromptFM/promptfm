name: ⏱️ 24/7 Zero-Cost Uptime & Health Monitor

on:
  schedule:
    # Run every 30 minutes (free tier on GitHub Actions for public repositories)
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uptime-check:
    name: 🩺 Probe PromptFM OCI app readiness and live status
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Ping OCI deploy readiness API
        run: |
          echo "Probing PromptFM OCI health endpoint..."
          HEALTHZ_URL="https://promptfm.live/api/healthz"
          HEALTH_STATUS=$(curl -s -o healthz.json -w "%{http_code}" --max-time 15 "$HEALTHZ_URL" || echo "000")
          echo "Health Response: $HEALTH_STATUS"
          if [ "$HEALTH_STATUS" -eq 200 ]; then
            cat healthz.json
          else
            echo "::warning ::Health endpoint returned code $HEALTH_STATUS"
            exit 1
          fi

      - name: 🌐 Ping live status smoke endpoint
        run: |
          echo "Probing PromptFM live status endpoint..."
          STATUS_URL="https://promptfm.live/api/status"
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" --max-time 20 "$STATUS_URL" || echo "000")
          echo "HTTP Response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 503 ]; then
            cat response.json
          else
            echo "::warning ::Status endpoint returned code $HTTP_STATUS"
          fi
