name: PromptFM CI Quality & Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# NOTE: Job `name:` properties must match their job keys (e.g. `lint-and-typecheck`).
# GitHub Actions uses the job name as the CheckRun context in the status API, and GitHub
# branch protection requires exact matching contexts (e.g. `lint-and-typecheck`).
# Do NOT use decorative emojis in job names, as they cause PR status checks to hang at
# "Expected — Waiting for status to be reported" (see PromptFM/promptfm#63).
jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      has_infra: ${{ steps.detect.outputs.has_infra }}
      has_ui: ${{ steps.detect.outputs.has_ui }}
      has_core_domain: ${{ steps.detect.outputs.has_core_domain }}
      is_dependabot: ${{ steps.detect.outputs.is_dependabot }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Paths & Actor
        id: detect
        run: |
          ACTOR="${{ github.actor }}"
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> $GITHUB_OUTPUT
          else
            echo "is_dependabot=false" >> $GITHUB_OUTPUT
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1 || true
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD 2>/dev/null || git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          fi

          echo "Detected changed files:"
          echo "$CHANGED_FILES"

          DOC_ONLY=true
          HAS_INFRA=false
          HAS_UI=false
          HAS_CORE=false
          HAS_SQL=false

          if [ -z "$CHANGED_FILES" ]; then
            DOC_ONLY=false
            HAS_UI=true
            HAS_CORE=true
            HAS_INFRA=true
            HAS_SQL=true
          else
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                *.md|docs/*|.github/ISSUE_TEMPLATE/*|LICENSE|.gitleaksignore|.env.local.example)
                  ;;
                supabase/*|*.sql)
                  DOC_ONLY=false
                  HAS_SQL=true
                  HAS_CORE=true
                  ;;
                infra/*|.github/workflows/ci.yml)
                  DOC_ONLY=false
                  HAS_INFRA=true
                  ;;
                src/app/*|src/components/*|playwright.config.ts|tests/e2e/*)
                  DOC_ONLY=false
                  HAS_UI=true
                  ;;
                src/lib/*|tests/unit/*|tests/integration/*|stryker.config.json)
                  DOC_ONLY=false
                  HAS_CORE=true
                  ;;
                *)
                  DOC_ONLY=false
                  HAS_UI=true
                  HAS_CORE=true
                  ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          echo "docs_only=$DOC_ONLY" >> $GITHUB_OUTPUT
          echo "has_infra=$HAS_INFRA" >> $GITHUB_OUTPUT
          echo "has_ui=$HAS_UI" >> $GITHUB_OUTPUT
          echo "has_core_domain=$HAS_CORE" >> $GITHUB_OUTPUT
          echo "has_sql=$HAS_SQL" >> $GITHUB_OUTPUT

  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run SQL Schema Linter
        if: needs.detect-changes.outputs.has_sql == 'true' || github.event_name == 'push'
        run: npm run lint:sql

      - name: Run Zero-Egress DNS Architecture Audit
        if: needs.detect-changes.outputs.has_infra == 'true' || github.event_name == 'push'
        run: npm run promptfm -- dns status promptfm.live --strict

      - name: Run Speed Insights & CI Performance Profiling
        run: npm run test:speed

  unit-and-integration-tests:
    name: unit-and-integration-tests
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Integration Tests with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key

  playwright-e2e-tests:
    name: playwright-e2e-tests
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium with Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore Next.js Build Cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          DEV_FALLBACK_SIMULATION: "true"

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: "true"
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          DEV_FALLBACK_SIMULATION: "true"

      - name: Upload Playwright Test Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mutation-testing:
    name: mutation-testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, lint-and-typecheck, unit-and-integration-tests]
    if: needs.detect-changes.outputs.is_dependabot != 'true' && needs.detect-changes.outputs.docs_only != 'true' && (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.has_core_domain == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Restore Stryker Incremental Cache
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ runner.os }}-${{ github.ref }}-
            stryker-incremental-${{ runner.os }}-refs/heads/main-
            stryker-incremental-${{ runner.os }}-

      - name: Run Stryker Targeted Mutation Testing (Pull Request)
        if: github.event_name == 'pull_request'
        run: npm run test:mutate:affected -- --base origin/${{ github.base_ref }}
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key

      - name: Run Stryker Mutation Testing (Push to Main)
        if: github.event_name == 'push'
        run: npm run test:mutate
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key

      - name: Archive Mutation Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  terraform-lint-validate:
    name: terraform-lint-validate
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_infra == 'true' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize Terraform (Local Validation)
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate Terraform Configuration
        run: terraform -chdir=infra/terraform validate

      - name: Check Oracle Streamer Module Formatting
        run: terraform fmt -check -recursive infra/terraform-oci

      - name: Initialize Oracle Streamer Module (Local Validation)
        run: terraform -chdir=infra/terraform-oci init -backend=false

      - name: Validate Oracle Streamer Module
        run: terraform -chdir=infra/terraform-oci validate

      - name: Check Terraform Live State vs Configuration (Dry-Run Plan)
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-sa-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json
            terraform -chdir=infra/terraform init -reconfigure
            set +e
            terraform -chdir=infra/terraform plan -detailed-exitcode -no-color
            TF_EXIT=$?
            set -e
            if [ "$TF_EXIT" -eq 0 ]; then
              echo "✅ Terraform State Check: Infrastructure matches live state (already applied)."
            elif [ "$TF_EXIT" -eq 2 ]; then
              echo "ℹ️ Terraform State Check: Unapplied configuration changes detected (plan pending apply)."
            else
              echo "❌ Terraform plan error."
              exit $TF_EXIT
            fi
          else
            echo "ℹ️ GCP_SA_KEY not present in environment; verified syntax and static validation."
          fi
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  ansible-lint-dryrun:
    name: ansible-lint-dryrun
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_infra == 'true' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python & Ansible
        run: |
          if ! command -v ansible-playbook &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y ansible
          fi

      - name: Lint Ansible Playbooks (Syntax Check)
        run: |
          env -u ANSIBLE_VAULT_PASSWORD_FILE ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml --syntax-check
          env -u ANSIBLE_VAULT_PASSWORD_FILE ansible-playbook -i infra/ansible/inventory.ini infra/ansible/hostinger-playbook.yml --syntax-check

      - name: Ansible Dry Run Task Verification
        run: |
          echo "Running Ansible playbook dry-run task verification..."
          env -u ANSIBLE_VAULT_PASSWORD_FILE ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml --list-tasks
          if [ -n "$GCP_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$GCP_SSH_KEY" > ~/.ssh/google_compute_engine
            chmod 600 ~/.ssh/google_compute_engine
            env -u ANSIBLE_VAULT_PASSWORD_FILE ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml --check --diff || true
          else
            echo "ℹ️ GCP_SSH_KEY not provided, verified task structure and syntax."
          fi
        env:
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}

  secret-leak-detection:
    name: secret-leak-detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History for Secret Scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Credential Scan
        run: |
          for i in 1 2 3 4 5; do
            if curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz -o gitleaks.tar.gz && tar -xzf gitleaks.tar.gz 2>/dev/null; then
              break
            fi
            echo "Retrying gitleaks download (attempt $i/5)..."
            sleep 3
          done
          if [ -f "./gitleaks" ]; then
            ./gitleaks detect --source=. --gitleaks-ignore-path=.gitleaksignore --verbose --redact
          else
            echo "::warning::Gitleaks binary download temporarily unavailable due to upstream GitHub CDN 504. Proceeding."
          fi

  codeql-security-scan:
    name: codeql-security-scan
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.is_dependabot != 'true' && needs.detect-changes.outputs.docs_only != 'true'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        continue-on-error: true
        with:
          languages: javascript-typescript
          tools: linked

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: '/language:javascript-typescript'

  package-vulnerability-scan:
    name: package-vulnerability-scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF Report to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-package-security'

  pr-guidance-comment:
    name: pr-guidance-comment
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - unit-and-integration-tests
      - mutation-testing
      - terraform-lint-validate
      - ansible-lint-dryrun
      - secret-leak-detection
      - codeql-security-scan
      - package-vulnerability-scan
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate PR Guidance Comment
        id: guidance
        env:
          PR_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CHECKS_PASSED: 'true'
        run: |
          npx jiti scripts/pr-guidance.ts

      - name: Post Guidance Comment to Pull Request
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr_comment.md')) {
              console.log('No pr_comment.md file found, skipping PR comment step.');
              return;
            }
            const commentBody = fs.readFileSync('pr_comment.md', 'utf8');
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              console.log('No PR number found in payload, skipping comment.');
              return;
            }
            
            // Check for existing bot comment to avoid duplicate spam
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const existingComment = comments.data.find(c =>
              c.body.includes('make an admin run the Make preview link workflow') ||
              c.body.includes('Quality & Security Gate')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
              console.log(`Updated existing PR comment #${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
              console.log(`Posted new PR guidance comment on PR #${prNumber}`);
            }

