name: PromptFM CI Quality & Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: 🧭 Detect Changed Paths & Scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      has_infra: ${{ steps.detect.outputs.has_infra }}
      has_ui: ${{ steps.detect.outputs.has_ui }}
      has_core_domain: ${{ steps.detect.outputs.has_core_domain }}
      is_dependabot: ${{ steps.detect.outputs.is_dependabot }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Paths & Actor
        id: detect
        run: |
          ACTOR="${{ github.actor }}"
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> $GITHUB_OUTPUT
          else
            echo "is_dependabot=false" >> $GITHUB_OUTPUT
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1 || true
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD 2>/dev/null || git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          fi

          echo "Detected changed files:"
          echo "$CHANGED_FILES"

          DOC_ONLY=true
          HAS_INFRA=false
          HAS_UI=false
          HAS_CORE=false

          if [ -z "$CHANGED_FILES" ]; then
            DOC_ONLY=false
            HAS_UI=true
            HAS_CORE=true
            HAS_INFRA=true
          else
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                *.md|docs/*|.github/ISSUE_TEMPLATE/*|LICENSE|.gitleaksignore|.env.local.example)
                  ;;
                infra/*|.github/workflows/ci.yml)
                  DOC_ONLY=false
                  HAS_INFRA=true
                  ;;
                src/app/*|src/components/*|playwright.config.ts|tests/e2e/*)
                  DOC_ONLY=false
                  HAS_UI=true
                  ;;
                src/lib/*|tests/unit/*|tests/integration/*|stryker.config.json)
                  DOC_ONLY=false
                  HAS_CORE=true
                  ;;
                *)
                  DOC_ONLY=false
                  HAS_UI=true
                  HAS_CORE=true
                  ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          echo "docs_only=$DOC_ONLY" >> $GITHUB_OUTPUT
          echo "has_infra=$HAS_INFRA" >> $GITHUB_OUTPUT
          echo "has_ui=$HAS_UI" >> $GITHUB_OUTPUT
          echo "has_core_domain=$HAS_CORE" >> $GITHUB_OUTPUT

  lint-and-typecheck:
    name: 🔍 Lint & Static Types
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

  unit-and-integration-tests:
    name: 🧪 Vitest Test Suite & Coverage (>=80%)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs_only != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Integration Tests with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key

  playwright-e2e-tests:
    name: 🎭 Playwright E2E UI, SEO & Crawler Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-typecheck, unit-and-integration-tests]
    if: needs.detect-changes.outputs.is_dependabot != 'true' && needs.detect-changes.outputs.docs_only != 'true' && (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.has_ui == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium Browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright browser binary cache hit; skipping system dependency reinstallation."
            npx playwright install chromium
          else
            echo "Installing Playwright chromium with system dependencies..."
            npx playwright install --with-deps chromium
          fi

      - name: Cache Next.js Build Output
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          DEV_FALLBACK_SIMULATION: "true"

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: "true"
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          DEV_FALLBACK_SIMULATION: "true"

      - name: Upload Playwright Test Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  mutation-testing:
    name: 🧬 Stryker Mutation Testing (Core Domain Logic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, lint-and-typecheck, unit-and-integration-tests]
    if: needs.detect-changes.outputs.is_dependabot != 'true' && needs.detect-changes.outputs.docs_only != 'true' && (github.ref == 'refs/heads/main' || needs.detect-changes.outputs.has_core_domain == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Restore Stryker Incremental Cache
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ runner.os }}-${{ github.ref }}-
            stryker-incremental-${{ runner.os }}-refs/heads/main-
            stryker-incremental-${{ runner.os }}-

      - name: Run Stryker Mutation Testing
        run: npm run test:mutate
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: https://mock-supabase.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key

      - name: Archive Mutation Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  terraform-lint-validate:
    name: ☁️ Terraform & Infra Validation
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_infra == 'true' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Check Terraform Formatting
        run: terraform fmt -recursive infra/terraform

      - name: Initialize Terraform (Local Validation)
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate Terraform Configuration
        run: terraform -chdir=infra/terraform validate

  secret-leak-detection:
    name: 🛡️ Gitleaks Secret & Credential Leak Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History for Secret Scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Credential Scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source=. --gitleaks-ignore-path=.gitleaksignore --verbose --redact

  codeql-security-scan:
    name: 🔒 CodeQL Security & Vulnerability Analysis
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.is_dependabot != 'true' && needs.detect-changes.outputs.docs_only != 'true'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  package-vulnerability-scan:
    name: 🛡️ Package & Supply Chain Vulnerability Scanner (Trivy & Audit)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF Report to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-package-security'
