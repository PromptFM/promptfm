name: 🔍 Create Preview Link in Vercel

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Git commit SHA to generate preview link for'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  create-preview-link:
    name: create-preview-link
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy Preview to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ Error: VERCEL_TOKEN secret is not configured in repository secrets."
            exit 1
          fi
          echo "Deploying preview for SHA ${{ inputs.commit_sha }}..."
          PREVIEW_URL=$(npx vercel deploy --token="$VERCEL_TOKEN" --yes)
          echo "Preview deployed: $PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Post Summary & Findings
        run: |
          echo "### 🔍 Vercel Preview Link Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ inputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Preview URL:** [${{ steps.vercel.outputs.preview_url }}](${{ steps.vercel.outputs.preview_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Budget Policy:** Protected under PromptFM \$0 Always-Free Tier" >> $GITHUB_STEP_SUMMARY

      - name: Comment Preview Link on PR (if associated)
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const sha = process.env.COMMIT_SHA;
            const previewUrl = process.env.PREVIEW_URL;
            
            // Search for PRs matching this commit sha
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            
            if (prs.data && prs.data.length > 0) {
              const prNumber = prs.data[0].number;
              const commentBody = `### 🔍 Vercel Preview Link Ready!\n\n- **Target SHA:** \`${sha}\`\n- **Preview URL:** ${previewUrl}\n\n*Deployed via Make preview link workflow under PromptFM $0 budget policy.*`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
              console.log(`Commented preview link on PR #${prNumber}`);
            } else {
              console.log(`No open PR found for commit ${sha}. Preview link rendered to step summary.`);
            }

