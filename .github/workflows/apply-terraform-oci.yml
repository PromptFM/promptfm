name: 🏗️ Apply Terraform (Oracle streamer)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the plan. Leave off to only preview it.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-apply-oci
  cancel-in-progress: false

jobs:
  apply-terraform-oci:
    name: apply-terraform-oci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Configure GCP Service Account Credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::GCP_SA_KEY secret is required in GitHub repository secrets."
            exit 1
          fi
          if echo "${{ secrets.GCP_SA_KEY }}" | grep -q '^{'; then
            echo "${{ secrets.GCP_SA_KEY }}" > /tmp/gcp-sa-key.json
          else
            echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > /tmp/gcp-sa-key.json
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json" >> $GITHUB_ENV

      - name: Initialize Terraform (Free GCS Backend)
        run: terraform -chdir=infra/terraform-oci init

      - name: Preview Terraform Plan
        run: terraform -chdir=infra/terraform-oci plan

      - name: Apply Terraform Infrastructure
        if: ${{ inputs.apply }}
        run: terraform -chdir=infra/terraform-oci apply -auto-approve

      - name: Show Streamer Address
        if: ${{ inputs.apply }}
        run: |
          echo "### Oracle streamer" >> $GITHUB_STEP_SUMMARY
          echo "Public IP: \`$(terraform -chdir=infra/terraform-oci output -raw public_ip)\`" >> $GITHUB_STEP_SUMMARY
