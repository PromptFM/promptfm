name: 🔐 Rotate Secret (GCP Secret Manager $0 Always-Free Tier)

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Target Secret Name in GCP Secret Manager'
        type: choice
        required: true
        options:
          - 'promptfm-database-url'
          - 'promptfm-supabase-service-role-key'
          - 'promptfm-hostinger-api-token'
          - 'promptfm-google-oauth-client-id'
          - 'promptfm-google-oauth-client-secret'
          - 'promptfm-oci-credentials'
      secret_value:
        description: 'New Secret Value (Masked in logs)'
        type: string
        required: true
      destroy_previous:
        description: 'Enforce $0 Rule: Destroy previous versions immediately (keeps active <= 6)'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: secret-rotation
  cancel-in-progress: false

jobs:
  rotate-secret:
    name: rotate-secret
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure GCP Service Account Credentials
        run: |
          mkdir -p ~/.config/gcloud
          if [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            if echo "${{ secrets.GCP_SA_KEY }}" | grep -q '^{'; then
              echo "${{ secrets.GCP_SA_KEY }}" > /tmp/gcp-sa-key.json
            else
              echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > /tmp/gcp-sa-key.json
            fi
            gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
            gcloud config set project promptfm-radio-1793623670
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json" >> $GITHUB_ENV
          else
            echo "::error::GCP_SA_KEY secret is required in GitHub repository secrets."
            exit 1
          fi

      - name: Add New Secret Version
        env:
          SECRET_NAME: ${{ github.event.inputs.secret_name }}
          SECRET_VALUE: ${{ github.event.inputs.secret_value }}
        run: |
          echo "::add-mask::$SECRET_VALUE"
          printf "%s" "$SECRET_VALUE" | gcloud secrets versions add "$SECRET_NAME" \
            --data-file=- \
            --project=promptfm-radio-1793623670
          echo "✓ Successfully added new version for $SECRET_NAME."

      - name: Enforce $0 Quota (Destroy Previous Versions)
        if: ${{ github.event.inputs.destroy_previous == 'true' || github.event.inputs.destroy_previous == true }}
        env:
          SECRET_NAME: ${{ github.event.inputs.secret_name }}
        run: |
          echo "Enforcing GCP $0 Always-Free Rule: Destroying prior versions to prevent quota exhaustion..."
          node -e "
            const { destroyPreviousSecretVersions } = require('./src/lib/infra/gcp-secrets');
            destroyPreviousSecretVersions(process.env.SECRET_NAME, { keepVersions: 1 })
              .then((destroyed) => {
                if (destroyed.length > 0) {
                  console.log('✓ Destroyed previous versions:', destroyed.join(', '));
                } else {
                  console.log('ℹ️ No prior active versions required destruction.');
                }
              })
              .catch((err) => {
                console.error('⚠️ Error destroying previous versions:', err.message);
                process.exit(1);
              });
          "

      - name: Audit Active Secret Versions Against $0 Quota (Max 6)
        run: |
          echo "### 🔐 Google Cloud Secret Manager $0 Quota Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Name | Active Versions (Enabled / Disabled) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          TOTAL_ACTIVE=0
          SECRETS=(
            "promptfm-database-url"
            "promptfm-supabase-service-role-key"
            "promptfm-hostinger-api-token"
            "promptfm-google-oauth-client-id"
            "promptfm-google-oauth-client-secret"
            "promptfm-oci-credentials"
          )

          for s in "${SECRETS[@]}"; do
            COUNT=$(gcloud secrets versions list "$s" --project=promptfm-radio-1793623670 --filter="state:(ENABLED OR DISABLED)" --format="value(name)" 2>/dev/null | grep -c . || true)
            TOTAL_ACTIVE=$((TOTAL_ACTIVE + COUNT))
            echo "| \`$s\` | $COUNT active | ✅ Free Tier |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Active Versions Across Project:** **$TOTAL_ACTIVE / 6 (Max Free Tier)**" >> $GITHUB_STEP_SUMMARY
          if [ "$TOTAL_ACTIVE" -le 6 ]; then
            echo "🎉 **SLA Verified: 100% $0.00 Always-Free Tier compliant.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **WARNING: Active versions exceed 6! Monthly storage charges may occur unless old versions are destroyed.**" >> $GITHUB_STEP_SUMMARY
          fi

