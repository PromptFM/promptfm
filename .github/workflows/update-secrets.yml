name: 🔐 Update App Secrets

on:
  workflow_dispatch:
    inputs:
      secret_key:
        description: 'Secret Key Name (e.g. SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY)'
        required: true
      secret_value:
        description: 'Secret Value (will be masked in logs)'
        required: true
      environments:
        description: 'Target Environments (comma-separated: production,preview,development)'
        required: false
        default: 'production,preview,development'

permissions:
  contents: read

jobs:
  update-secrets:
    name: update-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure GCP Service Account Credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::GCP_SA_KEY secret is required in repository secrets."
            exit 1
          fi
          if echo "${{ secrets.GCP_SA_KEY }}" | grep -q '^{' ; then
            echo "${{ secrets.GCP_SA_KEY }}" > /tmp/gcp-sa-key.json
          else
            echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > /tmp/gcp-sa-key.json
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json" >> "$GITHUB_ENV"
          gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json --project=promptfm-radio-1793623670

      - name: Document SecretShare Process & Link
        run: |
          echo "### 🔐 Secret Provisioning & SecretShare Runbook" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To safely share secrets across maintainers without leakage:" >> $GITHUB_STEP_SUMMARY
          echo "- **Encrypted SecretShare Service:** [https://secretshare.internal/promptfm-secrets](https://secretshare.internal/promptfm-secrets)" >> $GITHUB_STEP_SUMMARY
          echo "- **Process Documentation:** Refer to [\`docs/admin-guide.md\`](https://github.com/PromptFM/promptfm/blob/main/docs/admin-guide.md)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Key:** \`${{ inputs.secret_key }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environments:** \`${{ inputs.environments }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Validate & Synchronize Secrets to Google Cloud Secret Manager
        env:
          SECRET_KEY: ${{ inputs.secret_key }}
          SECRET_VALUE: ${{ inputs.secret_value }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          BUNDLE_SECRET_NAME="$(node scripts/resolve-oci-web-env.cjs --print-bundle-secret-name | tr -d '\n')"
          if [ -z "$BUNDLE_SECRET_NAME" ]; then
            echo "::error::config/non-infra-app-env.json must define gcpBundleSecretName."
            exit 1
          fi

          echo "::add-mask::$SECRET_VALUE"

          # Validate payload using environment variable validation rules and shared non-infra manifest.
          node -e '
            const manifest = require("./config/non-infra-app-env.json");
            const key = (process.env.SECRET_KEY || "").trim();
            const val = (process.env.SECRET_VALUE || "").trim();
            const envs = (process.env.ENVIRONMENTS || "").split(",").map(e => e.trim()).filter(Boolean);
            const allowed = new Set([...(manifest.buildKeys || []), ...(manifest.runtimeKeys || [])]);
            if (!key || !/^[A-Z][A-Z0-9_]*$/.test(key)) {
              throw new Error(`Invalid environment variable key: "${key}". Must start with uppercase letter and contain only [A-Z0-9_].`);
            }
            if (!allowed.has(key)) {
              throw new Error(`Secret key ${key} is not part of the shared non-infra app env manifest.`);
            }
            if (!val) {
              throw new Error("Secret value cannot be empty");
            }
            if (envs.length === 0) {
              throw new Error("At least one target environment must be specified");
            }
            console.log(`Validated secret key: ${key} for environments: ${envs.join(", ")}`);
          '

          if ! gcloud secrets describe "$BUNDLE_SECRET_NAME" --project=promptfm-radio-1793623670 >/dev/null 2>&1; then
            gcloud secrets create "$BUNDLE_SECRET_NAME" --replication-policy=automatic --project=promptfm-radio-1793623670
          fi

          EXISTING_BUNDLE_JSON="$(gcloud secrets versions access latest --secret="$BUNDLE_SECRET_NAME" --project=promptfm-radio-1793623670 2>/dev/null || true)"
          UPDATED_BUNDLE_JSON="$(python3 - <<'PY' "$EXISTING_BUNDLE_JSON" "$SECRET_KEY" "$SECRET_VALUE"
          import json, sys
          raw, key, value = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              data = json.loads(raw) if raw.strip() else {}
          except Exception:
              data = {}
          if not isinstance(data, dict):
              data = {}
          data[key] = value
          print(json.dumps(data, separators=(',', ':')))
          PY
          )"

          printf "%s" "$UPDATED_BUNDLE_JSON" | gcloud secrets versions add "$BUNDLE_SECRET_NAME" --data-file=- --project=promptfm-radio-1793623670

          DIRECT_GCP_SECRET_NAME="$(node scripts/resolve-oci-web-env.cjs --print-direct-gcp-secret-name "$SECRET_KEY" | tr -d '\n')"

          if [ -n "$DIRECT_GCP_SECRET_NAME" ]; then
            if ! gcloud secrets describe "$DIRECT_GCP_SECRET_NAME" --project=promptfm-radio-1793623670 >/dev/null 2>&1; then
              gcloud secrets create "$DIRECT_GCP_SECRET_NAME" --replication-policy=automatic --project=promptfm-radio-1793623670
            fi
            printf "%s" "$SECRET_VALUE" | gcloud secrets versions add "$DIRECT_GCP_SECRET_NAME" --data-file=- --project=promptfm-radio-1793623670
          fi

          for target_secret in "$BUNDLE_SECRET_NAME" "$DIRECT_GCP_SECRET_NAME"; do
            [ -z "$target_secret" ] && continue
            mapfile -t OLD_VERSIONS < <(gcloud secrets versions list "$target_secret" --project=promptfm-radio-1793623670 --sort-by='~createTime' --format='value(name)' | tail -n +2)
            for version in "${OLD_VERSIONS[@]}"; do
              [ -z "$version" ] && continue
              gcloud secrets versions destroy "$version" --secret="$target_secret" --project=promptfm-radio-1793623670 --quiet >/dev/null
            done
          done

          echo "✓ Successfully synchronized $SECRET_KEY to Google Cloud Secret Manager"

      - name: Best-Effort Synchronize Secrets to Vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SECRET_KEY: ${{ inputs.secret_key }}
          SECRET_VALUE: ${{ inputs.secret_value }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not configured in repository secrets; skipping Vercel sync."
            exit 0
          fi

          echo "::add-mask::$SECRET_VALUE"

          IFS=',' read -ra ENVS <<< "$ENVIRONMENTS"
          for env in "${ENVS[@]}"; do
            trimmed_env=$(echo "$env" | xargs)
            [ -z "$trimmed_env" ] && continue
            echo "Adding/Updating $SECRET_KEY for environment: $trimmed_env..."
            # Remove existing env var if present to allow overwrite without prompt
            npx vercel env rm "$SECRET_KEY" "$trimmed_env" --token="$VERCEL_TOKEN" --yes 2>/dev/null || true
            # Add updated env var
            printf "%s" "$SECRET_VALUE" | npx vercel env add "$SECRET_KEY" "$trimmed_env" --token="$VERCEL_TOKEN"
            echo "✓ Successfully set $SECRET_KEY in $trimmed_env"
          done

          echo "✓ Successfully synchronized $SECRET_KEY to Vercel"
