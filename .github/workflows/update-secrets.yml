name: 🔐 Update Secrets in Vercel

on:
  workflow_dispatch:
    inputs:
      secret_key:
        description: 'Secret Key Name (e.g. SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY)'
        required: true
      secret_value:
        description: 'Secret Value (will be masked in logs)'
        required: true
      environments:
        description: 'Target Environments (comma-separated: production,preview,development)'
        required: false
        default: 'production,preview,development'

permissions:
  contents: read

jobs:
  update-secrets:
    name: update-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Document SecretShare Process & Link
        run: |
          echo "### 🔐 Secret Provisioning & SecretShare Runbook" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To safely share secrets across maintainers without leakage:" >> $GITHUB_STEP_SUMMARY
          echo "- **Encrypted SecretShare Service:** [https://secretshare.internal/promptfm-secrets](https://secretshare.internal/promptfm-secrets)" >> $GITHUB_STEP_SUMMARY
          echo "- **Process Documentation:** Refer to [\`docs/admin-guide.md\`](https://github.com/PromptFM/promptfm/blob/main/docs/admin-guide.md)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Key:** \`${{ inputs.secret_key }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environments:** \`${{ inputs.environments }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Validate & Synchronize Secrets to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SECRET_KEY: ${{ inputs.secret_key }}
          SECRET_VALUE: ${{ inputs.secret_value }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ Error: VERCEL_TOKEN secret is not configured in repository secrets."
            exit 1
          fi

          # Validate payload using environment variable validation rules
          node -e '
            const key = (process.env.SECRET_KEY || "").trim();
            const val = (process.env.SECRET_VALUE || "").trim();
            const envs = (process.env.ENVIRONMENTS || "").split(",").map(e => e.trim()).filter(Boolean);
            if (!key || !/^[A-Z][A-Z0-9_]*$/.test(key)) {
              throw new Error(`Invalid environment variable key: "${key}". Must start with uppercase letter and contain only [A-Z0-9_].`);
            }
            if (!val) {
              throw new Error("Secret value cannot be empty");
            }
            if (envs.length === 0) {
              throw new Error("At least one target environment must be specified");
            }
            console.log(`Validated secret key: ${key} for environments: ${envs.join(", ")}`);
          '

          IFS=',' read -ra ENVS <<< "$ENVIRONMENTS"
          for env in "${ENVS[@]}"; do
            trimmed_env=$(echo "$env" | xargs)
            [ -z "$trimmed_env" ] && continue
            echo "Adding/Updating $SECRET_KEY for environment: $trimmed_env..."
            # Remove existing env var if present to allow overwrite without prompt
            npx vercel env rm "$SECRET_KEY" "$trimmed_env" --token="$VERCEL_TOKEN" --yes 2>/dev/null || true
            # Add updated env var
            printf "%s" "$SECRET_VALUE" | npx vercel env add "$SECRET_KEY" "$trimmed_env" --token="$VERCEL_TOKEN"
            echo "✓ Successfully set $SECRET_KEY in $trimmed_env"
          done

