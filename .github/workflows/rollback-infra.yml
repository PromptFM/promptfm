name: ⏪ Rollback Infrastructure

# Switches the infrastructure, including which host serves the stream, back to an earlier snapshot.
# It applies the target tag with the same workflow as a normal release, so a rollback and a release
# take the same path and nothing is repeated here. Example target_ref: promptfm-infra/0.2.0-abc1234
# (snapshots from 0.2.0 on carry infra/converge-stream.sh; the 0.1.0 tag predates it and cannot be applied).
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Tag or commit to switch back to, for example promptfm-infra/0.2.0-abc1234'
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: terraform-rollback
  cancel-in-progress: false

jobs:
  rollback-infra:
    name: rollback-infra
    uses: ./.github/workflows/apply-terraform.yml
    with:
      ref: ${{ inputs.target_ref }}
    secrets: inherit

  record-rollback:
    name: record-rollback
    needs: rollback-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Tag and Record Infrastructure Rollback Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: npm run promptfm -- tag infra-rollback "$TARGET_REF"
