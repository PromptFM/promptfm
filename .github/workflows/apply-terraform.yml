name: 🏗️ Apply Infrastructure

# Converges the infrastructure to the commit it runs on, including which host serves the stream
# (infra/stream-host: oracle or gcp). Three ways to run it:
#  - push a promptfm-infra/* tag that is on main (the normal release)
#  - run it by hand and give a ref, for example promptfm-infra/0.2.0-abc1234, to switch the stream to that snapshot
#  - the rollback workflow calls it with the target ref
# A tag whose commit is not on main is not applied automatically: snapshot tags are applied by hand.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to apply, for example promptfm-infra/0.2.0-abc1234. Empty applies the branch you run it on.'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'promptfm-infra/*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply-terraform:
    name: apply-terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Decide whether to apply
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            case "$GITHUB_REF_NAME" in
              promptfm-infra/rollback-*)
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Rollback tags only record a rollback. To switch back, run the Rollback Infrastructure workflow with target_ref."
                exit 0
                ;;
            esac
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "::notice::This tag's commit is not on main, so it is not applied automatically. Run this workflow by hand with ref set to the tag to apply it."
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Pull Secrets from Vercel (Single Source of Truth)
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel env pull .env.infra.local --environment=production --yes
          else
            echo "ℹ️ VERCEL_TOKEN not provided, skipping Vercel env pull."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prepare Infrastructure & Credentials (0-Cost Always-Free Tier)
        if: steps.guard.outputs.run == 'true'
        run: npm run prepare-infra
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: 'promptfm-radio-1793623670'
          DOMAIN_NAME: 'promptfm.live'

      - name: Setup Terraform
        if: steps.guard.outputs.run == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Configure GCP Service Account Credentials
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ -f "$HOME/.config/gcloud/promptfm-terraform-key.json" ] && grep -q '^{' "$HOME/.config/gcloud/promptfm-terraform-key.json"; then
            echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/promptfm-terraform-key.json" >> $GITHUB_ENV
            gcloud auth activate-service-account --key-file="$HOME/.config/gcloud/promptfm-terraform-key.json" --project=promptfm-radio-1793623670 || true
            echo "GCP credentials configured successfully from restored key file."
          elif [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            if echo "${{ secrets.GCP_SA_KEY }}" | grep -q '^{'; then
              echo "${{ secrets.GCP_SA_KEY }}" > /tmp/gcp-sa-key.json
            else
              echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > /tmp/gcp-sa-key.json
            fi
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json" >> $GITHUB_ENV
            echo "GOOGLE_CREDENTIALS=$(cat /tmp/gcp-sa-key.json | tr -d '\n')" >> $GITHUB_ENV
            gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json --project=promptfm-radio-1793623670 || true
            echo "GCP credentials configured successfully from GitHub secrets."
          else
            echo "ℹ️ Using application default credentials or ambient auth."
          fi
          gcloud config set project promptfm-radio-1793623670 || true

      - name: Read the stream host from infra/stream-host
        if: steps.guard.outputs.run == 'true'
        run: |
          HOST="$(tr -d '[:space:]' < infra/stream-host)"
          echo "The stream is served from: $HOST"
          # The GCP VM runs only while it serves the stream.
          if [ "$HOST" = "gcp" ]; then
            echo "TF_VAR_streamer_vm_running=true" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_streamer_vm_running=false" >> "$GITHUB_ENV"
          fi

      - name: Setup Ansible (Zero-Cost Configuration Management)
        if: steps.guard.outputs.run == 'true'
        run: |
          if ! command -v ansible-playbook &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ansible
          fi

      - name: Initialize Terraform (Free GCS Backend)
        if: steps.guard.outputs.run == 'true'
        run: terraform -chdir=infra/terraform init

      - name: Take the other host out of service first
        if: steps.guard.outputs.run == 'true'
        run: infra/converge-stream.sh quiesce

      - name: Preview Terraform Plan
        if: steps.guard.outputs.run == 'true'
        run: terraform -chdir=infra/terraform plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Terraform Infrastructure
        if: steps.guard.outputs.run == 'true'
        run: terraform -chdir=infra/terraform apply -auto-approve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Put the stream on the chosen host (containers, DNS, check)
        if: steps.guard.outputs.run == 'true'
        run: infra/converge-stream.sh serve

      - name: Tag and Record Infrastructure Release
        if: github.event_name == 'workflow_dispatch' && inputs.ref == ''
        run: npm run promptfm -- tag infra
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
