name: 🏗️ Apply Terraform Changes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'infra/ansible/**'
      - 'scripts/prepare-infra.ts'
      - 'src/lib/infra/prepare-infra.ts'
      - '.github/workflows/apply-terraform.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply-terraform:
    name: apply-terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Infrastructure & Credentials (0-Cost Always-Free Tier)
        run: npm run prepare-infra
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          GCP_PROJECT_ID: 'promptfm-radio-1793623670'
          DOMAIN_NAME: 'promptfm.live'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Configure GCP Service Account Credentials
        run: |
          if [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > /tmp/gcp-sa-key.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json" >> $GITHUB_ENV
            echo "GOOGLE_CREDENTIALS=$(echo '${{ secrets.GCP_SA_KEY }}' | base64 -d | tr -d '\n')" >> $GITHUB_ENV
            echo "GCP credentials configured successfully."
          else
            echo "⚠️ GCP_SA_KEY not provided in secrets; falling back to local credentials/default auth."
          fi

      - name: Initialize Terraform (Free GCS Backend)
        run: terraform -chdir=infra/terraform init

      - name: Preview Terraform Plan
        run: terraform -chdir=infra/terraform plan

      - name: Apply Terraform Infrastructure
        run: terraform -chdir=infra/terraform apply -auto-approve

