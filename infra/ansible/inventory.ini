[streamer]
# Replaced dynamically by Terraform output or orchestrator script
promptfm-streamer ansible_host=34.123.80.137 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/google_compute_engine

# Oracle Always Free host. Fill in the IP from `terraform output public_ip` (infra/terraform-oci), then uncomment.
# Caddy must listen on all interfaces here because there is no Cloudflare Tunnel in front of it.
# promptfm-streamer-oci ansible_host=<terraform output public_ip> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519 caddy_bind_address=0.0.0.0

[streamer:vars]
app_dir=/opt/promptfm/streamer
promptfm_api_url=https://promptfm.live
stream_bitrate=128
icecast_port=8000
icecast_source_password=promptfm_source_2026
icecast_admin_password=promptfm_admin_2026

[local]
localhost ansible_connection=local

[local:vars]
# Hostinger API Token can be specified here or via export HOSTINGER_API_TOKEN="..."
# hostinger_token=your-hostinger-api-token

