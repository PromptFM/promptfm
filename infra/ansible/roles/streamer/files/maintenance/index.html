<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptFM — Under Maintenance</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050816;
        --panel: rgba(12, 19, 42, 0.88);
        --border: rgba(112, 150, 255, 0.26);
        --text: #f7f8ff;
        --muted: #b7bedc;
        --accent: #79a8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(76, 112, 212, 0.24), transparent 42%),
          linear-gradient(180deg, #070b18 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        width: min(100%, 720px);
        padding: 40px 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 16px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(121, 168, 255, 0.14);
        color: var(--accent);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
      }

      .primary {
        background: var(--accent);
        color: #04122f;
      }

      .secondary {
        border: 1px solid var(--border);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">PromptFM</div>
      <h1>Under Maintenance</h1>
      <p>
        PromptFM is temporarily offline while we move the public site onto a new host.
        We&rsquo;re keeping this page simple on purpose so the station can come back safely first,
        then the full app can follow.
      </p>
      <div class="actions">
        <a class="primary" href="https://stream.promptfm.live/stream.mp3">Direct stream</a>
        <a class="secondary" href="https://stream.promptfm.live/">Stream host</a>
      </div>
    </main>
  </body>
</html>
